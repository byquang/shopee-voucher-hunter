name: Shopee Voucher Hunter

on:
  pull_request:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Choose what to run
        type: choice
        options:
          - preview
          - test-telegram
          - hunt
        default: preview

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'pull_request' || inputs.mode == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - if: inputs.mode == 'preview'
        run: python hunter.py --dry-run

  deliver:
    if: >-
      github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'schedule' || inputs.mode == 'hunt' || inputs.mode == 'test-telegram')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: shopee-voucher-alerts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Hunt or test Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HUNT_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$HUNT_MODE" == test-telegram ]]; then
            python hunter.py --test-telegram
          elif [[ "$GITHUB_EVENT_NAME" == schedule && ( -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ) ]]; then
            echo '::notice::Add the Telegram repository secrets to enable scheduled alerts.'
          else
            python hunter.py
          fi
      - name: Save alert history
        if: inputs.mode != 'test-telegram'
        run: |
          if [[ ! -f seen.json ]]; then
            exit 0
          fi
          git add -- seen.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Shopee alert history'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
